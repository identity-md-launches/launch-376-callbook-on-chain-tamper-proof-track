[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"
ffi = false
fs_permissions = []
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256

[fmt]
line_length = 120
